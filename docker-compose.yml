name: helpic-frontend

services:
  frontend:
    build:
      context: .
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8090/api/v1}
      # The backend lives in another compose project, so the dev proxy reaches
      # it through the host's published port.
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://host.docker.internal:8090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Live-reload: the source is bind-mounted, node_modules stays in the image.
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5180}:5173"

  # Production-like build: `docker compose --profile prod up --build frontend-prod`
  frontend-prod:
    profiles: [prod]
    build:
      context: .
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    environment:
      # Where the browser calls the API. Empty means same origin, /api/v1.
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8090/api/v1}
    ports:
      - "127.0.0.1:${FRONTEND_PROD_PORT:-8091}:80"
