server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security.conf;

    # A proxy that has not terminated TLS yet tells us with this header.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # The API address is written here when the container starts.
    location = /config.js {
        include /etc/nginx/security.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|woff2?|png|jpg|jpeg|gif|ico)$ {
        include /etc/nginx/security.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
